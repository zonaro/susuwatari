<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Susuwatari Canvas - Coelhinhos de Poeira</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            height: 100vh;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        #susuwatari-canvas {
            display: block;
            cursor: default;
        }

        .ui-info {
            position: absolute;
            top: 10px;
            left: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-family: Arial, sans-serif;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
            display: none;
            /* Inicia escondida */
        }
    </style>
</head>

<body>
    <canvas id="susuwatari-canvas"></canvas>
    <div class="ui-info">
        🎮 Scroll: Tamanho | Clique: Adicionar/Remover | Direito: Toggle UI<br>
        💫 Susuwatari: <span id="count">0</span> | FPS: <span id="fps">0</span>
    </div>
    <script src="susuwatari.js"></script>
</body>

</html>
