<!-- Este é um arquivo SVG de exemplo para testar o folder dropdown -->
<svg width="1920" height="1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2d1b69;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#11998e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#grad1)"/>
  
  <!-- Stars -->
  <circle cx="200" cy="150" r="2" fill="white" opacity="0.8"/>
  <circle cx="350" cy="100" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="800" cy="200" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="1200" cy="120" r="1" fill="white" opacity="0.5"/>
  <circle cx="1500" cy="180" r="2" fill="white" opacity="0.7"/>
  <circle cx="400" cy="300" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="900" cy="350" r="2" fill="white" opacity="0.8"/>
  <circle cx="1300" cy="280" r="1" fill="white" opacity="0.5"/>
  <circle cx="100" cy="450" r="2.5" fill="white" opacity="0.9"/>
  <circle cx="600" cy="500" r="1.5" fill="white" opacity="0.6"/>
  
  <!-- Mystical orbs -->
  <circle cx="300" cy="600" r="20" fill="#38ef7d" opacity="0.3" filter="url(#glow)"/>
  <circle cx="1400" cy="700" r="15" fill="#667eea" opacity="0.4" filter="url(#glow)"/>
  <circle cx="700" cy="800" r="25" fill="#f093fb" opacity="0.2" filter="url(#glow)"/>
  
  <!-- Title text -->
  <text x="960" y="540" font-family="Arial, sans-serif" font-size="48" fill="white" text-anchor="middle" opacity="0.3">
    Susuwatari Background Example
  </text>
  <text x="960" y="580" font-family="Arial, sans-serif" font-size="24" fill="white" text-anchor="middle" opacity="0.5">
    Folder Dropdown Test Image
  </text>
</svg>